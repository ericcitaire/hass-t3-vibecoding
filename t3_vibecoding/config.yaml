name: "T3 Code + OpenCode"
version: "0.6.0"
slug: "t3_vibecoding"
description: >-
  Environnement de vibe coding headless : serveur T3 Code + OpenCode, avec git,
  node, ripgrep et outils usuels, exécutés sous un utilisateur non-root.
url: "https://github.com/pingdotgg/t3code"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
map:
  - type: share
    read_only: false
ports:
  "4096/tcp": 4096
  "8081/tcp": 8081
webui: "http://[HOST]:[PORT:4096]/"
watchdog: "tcp://[HOST]:[PORT:4096]"
options:
  workspace: "/share/vibecoding"
  git_name: ""
  git_email: ""
  github_token: ""
  env_vars: []
  opencode_config_json: ""
  opencode_auth_json: ""
  t3_settings_json: ""
  code_server: false
  code_server_password: ""
schema:
  workspace: str
  git_name: "str?"
  git_email: "str?"
  github_token: "password?"
  env_vars:
    - name: str
      value: password
  opencode_config_json: "str?"
  opencode_auth_json: "str?"
  t3_settings_json: "str?"
  code_server: bool
  code_server_password: "password?"
