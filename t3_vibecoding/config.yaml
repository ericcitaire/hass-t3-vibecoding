name: "T3 Code + OpenCode"
version: "0.9.0"
slug: "t3_vibecoding"
description: >-
  Headless vibe coding environment: T3 Code + OpenCode server, with git, node,
  ripgrep and common tooling, running as a non-root user.
url: "https://github.com/pingdotgg/t3code"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
map:
  - type: share
    read_only: false
ports:
  "4096/tcp": 4096
webui: "http://[HOST]:[PORT:4096]/"
watchdog: "tcp://[HOST]:[PORT:4096]"
options:
  workspace: "/share/vibecoding"
  git_name: ""
  git_email: ""
  github_token: ""
  env_vars: []
  opencode_config_json: ""
  opencode_auth_json: ""
  t3_settings_json: ""
schema:
  workspace: str
  git_name: "str?"
  git_email: "str?"
  github_token: "password?"
  env_vars:
    - name: str
      value: password
  opencode_config_json: "str?"
  opencode_auth_json: "str?"
  t3_settings_json: "str?"
