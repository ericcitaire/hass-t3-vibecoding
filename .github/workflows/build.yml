name: Build add-on image

on:
  push:
    branches:
      - main
    paths:
      - "t3_vibecoding/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-addon-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: hass-t3-vibecoding

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read add-on version
        id: version
        run: |
          version="$(python3 scripts/addon-info.py version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: t3_vibecoding
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=T3 Code + OpenCode
            io.hass.description=Headless vibe coding environment: T3 Code + OpenCode server
            io.hass.url=https://github.com/${{ github.repository }}
          push: "true"
          skip-existing: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          skip-existing: ${{ needs.init.outputs.version }}

  # The GitHub Release is the durable pointer from an image tag back to the
  # source commit. It is created only after the multi-arch manifest is
  # published, so a failed or partial build never announces a release.
  github-release:
    name: Tag and publish the GitHub Release
    needs: [init, build, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # The previous commit tells us whether this push bumped the version.
          fetch-depth: 0
      - name: Decide whether this push releases
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists; nothing to do."
            exit 0
          fi
          # A release is a version bump: a push that leaves `version` untouched
          # rebuilds an already published image and must not create a tag.
          previous_config="${RUNNER_TEMP}/previous-config.yaml"
          if ! git show 'HEAD^:t3_vibecoding/config.yaml' > "${previous_config}" 2>/dev/null; then
            echo "::error::cannot read t3_vibecoding/config.yaml at HEAD^."
            exit 1
          fi
          previous="$(python3 scripts/addon-info.py version --from "${previous_config}")"
          if [ "${previous}" = "${VERSION}" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "config.yaml version is unchanged; this push is not a release."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "config.yaml version: ${previous} -> ${VERSION}."
      - name: Extract the release notes
        if: steps.decide.outputs.release == 'true'
        run: python3 scripts/changelog-entry.py > "${RUNNER_TEMP}/notes.md"
      - name: Create the tag and GitHub Release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            remote_commit="$(git ls-remote origin "refs/tags/${tag}^{}" | cut -f1)"
            if [ -n "${remote_commit}" ] && [ "${remote_commit}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${tag} already points to ${remote_commit}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "Release ${VERSION}" "${GITHUB_SHA}"
            git push origin "${tag}"
          fi
          image="$(python3 scripts/addon-info.py image)"
          body="${RUNNER_TEMP}/release-body.md"
          {
            echo "Image: \`${image}:${VERSION}\`"
            echo
            echo "Architectures: \`amd64\`, \`aarch64\`."
            echo
            echo "---"
            echo
            cat "${RUNNER_TEMP}/notes.md"
          } > "${body}"
          gh release create "${tag}" --verify-tag \
            --title "T3 Code + OpenCode ${VERSION}" \
            --notes-file "${body}"
