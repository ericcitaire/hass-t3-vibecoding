name: Verify add-on options

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Verify option truth
        run: python scripts/verify-options.py
