name: Verify add-on

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Ref to verify instead of the triggering commit
        type: string
        required: false
        default: ""

jobs:
  verify-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Verify option truth
        run: python scripts/verify-options.py
      - name: Verify release metadata
        run: python scripts/verify-versions.py
      - name: Verify PDF tooling
        run: python scripts/verify-pdf-packages.py
      - name: Test startup module
        run: bash tests/test-startup.sh
      - name: Test credentials module
        run: bash tests/test-credentials.sh
      - name: Test release metadata helpers
        run: python -m unittest discover --start-directory tests --pattern "test_*.py"

  first-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check that the first prompt is powerlevel10k's
        run: |
          P10K_VERSION="$(sed -n 's/^ARG POWERLEVEL10K_VERSION=//p' t3_vibecoding/Dockerfile)"
          python3 tests/test-first-prompt.py --p10k-version "${P10K_VERSION}"

  browser-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install T3
        run: |
          T3_VERSION="$(sed -n 's/^ARG T3_VERSION=//p' t3_vibecoding/Dockerfile)"
          npm install --no-save --prefix "${RUNNER_TEMP}/t3" "t3@${T3_VERSION}"
          # t3 >= 0.1.1 is a launcher: it downloads the platform binary into
          # $T3CODE_HOME/runtime/versions/<version> instead of installing
          # @t3code/* npm packages. Running it once fetches that binary.
          T3CODE_HOME="${RUNNER_TEMP}/t3-home" \
            "${RUNNER_TEMP}/t3/node_modules/.bin/t3" --version
      - name: Compare browser packages with T3
        run: |
          T3_VERSION="$(sed -n 's/^ARG T3_VERSION=//p' t3_vibecoding/Dockerfile)"
          # t3 >= 0.1.1 installs the binary into $T3CODE_HOME; older releases
          # ship the platform package under @t3code/. Search both, newest first.
          mkdir -p "${RUNNER_TEMP}/t3-home"
          T3_BINARY="$(find "${RUNNER_TEMP}/t3-home" "${RUNNER_TEMP}/t3" \
            -type f -name t3 -perm -u+x -print -quit)"
          if [ ! -x "${T3_BINARY}" ]; then
            echo "no t3 executable found for ${T3_VERSION}" >&2
            exit 1
          fi
          python3 scripts/verify-browser-packages.py --binary "${T3_BINARY}"

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x -s bash \
            t3_vibecoding/run.sh \
            t3_vibecoding/lib/*.sh \
            tests/*.sh

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: t3_vibecoding/Dockerfile
          config: .hadolint.yaml
