name: Verify add-on

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Ref to verify instead of the triggering commit
        type: string
        required: false
        default: ""

jobs:
  verify-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Verify option truth
        run: python scripts/verify-options.py
      - name: Verify release metadata
        run: python scripts/verify-versions.py
      - name: Test startup module
        run: bash tests/test-startup.sh
      - name: Test credentials module
        run: bash tests/test-credentials.sh
      - name: Test release metadata helpers
        run: python -m unittest discover --start-directory tests --pattern "test_*.py"

  browser-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install T3
        run: |
          T3_VERSION="$(sed -n 's/^ARG T3_VERSION=//p' t3_vibecoding/Dockerfile)"
          npm install --no-save --prefix "${RUNNER_TEMP}/t3" "t3@${T3_VERSION}"
      - name: Compare browser packages with T3
        run: |
          T3_BINARY="$(find "${RUNNER_TEMP}/t3/node_modules/@t3code" -type f -name t3 -print -quit)"
          python3 scripts/verify-browser-packages.py --binary "${T3_BINARY}"

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x -s bash \
            t3_vibecoding/run.sh \
            t3_vibecoding/lib/*.sh \
            tests/*.sh

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: t3_vibecoding/Dockerfile
          config: .hadolint.yaml
